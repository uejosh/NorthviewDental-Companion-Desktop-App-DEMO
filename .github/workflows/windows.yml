# Builds the Windows installer ZIP (NorthviewOffice.exe + per-user install.ps1).
#  - every push to main / pull request: test + build, ZIP attached to the run as an artifact
#  - pushing a tag like v0.1.0: also publishes a GitHub Release with the ZIP
#  - can be started by hand from the Actions tab (Run workflow)
name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "server/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "server/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: cargo test

      - name: Build release and package
        run: python package.py

      - name: Find package
        id: pkg
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "NorthviewOffice-*-windows.zip" | Select-Object -First 1
          if (-not $zip) { throw "Windows ZIP was not produced" }
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($zip.BaseName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.pkg.outputs.path }}" `
            --title "Northview Office ${{ github.ref_name }}" `
            --notes "Windows installer: unzip, then right-click install.ps1 > Run with PowerShell. Demo data works out of the box; live mode needs the site address and device key from the website (Tools > Northview Office App)."
