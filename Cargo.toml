[package]
default-run = "nvdental-office-app"
name = "nvdental-office-app"
version = "0.1.1"
edition = "2021"
description = "Northview Dental Office App - front-desk companion for the website"
authors = ["Sturl Digital Services"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.31", features = ["datepicker", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
notify-rust = "4"
open = "5"
dirs = "6"
rfd = "0.15"
typst-as-lib = "0.17"
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
